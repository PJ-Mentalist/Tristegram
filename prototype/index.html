<title>Tristegram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
<style>
/* Layout: окно десктоп-клиента — стеклянная шапка, слева чаты, справа переписка; на телефоне одна колонка. Ночной режим — основной, дневной включается в приложении. */
:root{
  color-scheme: dark;
  --brand: #F07A0C; --brand-rgb: 240,122,12;
  --accent: #F07A0C; --accent-rgb: 240,122,12; --accent2: #FFB340;
  --bg: #07070a;
  --surface: rgba(26,26,31,.58);
  --surface-2: rgba(20,20,24,.76);
  --pop: rgba(34,34,39,.86);
  --solid: #18181c;
  --bubble-in: rgba(44,44,50,.86);
  --chat: rgba(10,10,12,.55);
  --head-a: rgba(40,40,46,.62); --head-b: rgba(24,24,28,.5);
  --text: rgba(255,255,255,.96);
  --text-2: rgba(235,235,245,.6);
  --text-3: rgba(235,235,245,.38);
  --fill: rgba(118,118,128,.2);
  --fill-2: rgba(118,118,128,.3);
  --hover: rgba(255,255,255,.06);
  --sep: rgba(84,84,88,.45);
  --stroke: rgba(255,255,255,.085);
  --stroke-hi: rgba(255,255,255,.14);
  --pattern: rgba(255,255,255,.05);
  --scrim: rgba(0,0,0,.3);
  --danger: #FF453A;
  --shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 .5px rgba(0,0,0,.6), 0 18px 50px -12px rgba(0,0,0,.65), 0 4px 14px rgba(0,0,0,.35);
  --shadow-pop: 0 30px 80px -20px rgba(0,0,0,.85), 0 0 0 .5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  --blur: 28px; --radius: 22px; --bubble-r: 18px; --fs: 15px;
  --av-r: 50%;
  --spd: 1;
  --d1: calc(.22s * var(--spd));
  --d2: calc(.5s * var(--spd));
  --spring: cubic-bezier(.32,.72,0,1);
  --ease: cubic-bezier(.25,.1,.25,1);
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  --display: Manrope, Inter, -apple-system, "Segoe UI", sans-serif;
}
:root.light{
  color-scheme: light;
  --bg: #e9ebf1;
  --surface: rgba(255,255,255,.62);
  --surface-2: rgba(255,255,255,.78);
  --pop: rgba(250,250,252,.9);
  --solid: #f7f7f9;
  --bubble-in: rgba(255,255,255,.96);
  --chat: rgba(255,255,255,.35);
  --head-a: rgba(255,255,255,.8); --head-b: rgba(255,255,255,.62);
  --text: rgba(0,0,0,.9);
  --text-2: rgba(60,60,67,.66);
  --text-3: rgba(60,60,67,.42);
  --fill: rgba(118,118,128,.12);
  --fill-2: rgba(118,118,128,.2);
  --hover: rgba(0,0,0,.045);
  --sep: rgba(60,60,67,.18);
  --stroke: rgba(0,0,0,.07);
  --stroke-hi: rgba(0,0,0,.1);
  --pattern: rgba(0,0,0,.06);
  --scrim: rgba(0,0,0,.15);
  --shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 0 0 .5px rgba(0,0,0,.06), 0 18px 40px -16px rgba(30,30,60,.25);
  --shadow-pop: 0 30px 70px -20px rgba(30,30,60,.35), 0 0 0 .5px rgba(0,0,0,.08);
}
*{ box-sizing: border-box; }
html, body{ height: 100%; }
body{ margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs)/1.35 var(--font); letter-spacing: -.011em; -webkit-font-smoothing: antialiased; overflow: hidden; }
button{ font: inherit; color: inherit; }
:focus-visible{ outline: 2px solid rgba(var(--accent-rgb),.8); outline-offset: 2px; }
svg.i{ width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#aurora{ position: fixed; inset: -20vmax; z-index: 0; pointer-events: none;
  background: radial-gradient(38vmax 38vmax at 10% 15%, rgba(var(--brand-rgb),.2), transparent 60%), radial-gradient(34vmax 34vmax at 90% 10%, rgba(94,92,230,.14), transparent 60%), radial-gradient(40vmax 40vmax at 72% 98%, rgba(var(--accent-rgb),.1), transparent 60%);
  animation: drift 40s var(--ease) infinite alternate; }
.no-aurora #aurora{ display: none; }
@keyframes drift{ 50%{ transform: translate3d(2vmax,-1.5vmax,0) scale(1.04); } 100%{ transform: translate3d(-2vmax,1.5vmax,0) scale(1.02); } }

.app{ position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 12px; padding-block: 10px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.glass{ background: var(--surface); -webkit-backdrop-filter: blur(var(--blur)) saturate(180%); backdrop-filter: blur(var(--blur)) saturate(180%); border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow); }

/* ── Аватарки ── */
.avw{ position: relative; display: inline-grid; flex: none; border-radius: var(--av-r); transition: transform var(--d2) var(--spring); }
.av{ width: var(--s, 50px); height: var(--s, 50px); border-radius: var(--av-r); display: grid; place-items: center; overflow: hidden; color: #fff; font-weight: 600; font-size: calc(var(--s, 50px) * .38); }
.av svg{ width: 100%; height: 100%; }
.av.dark{ background: #0d0d10; padding: 12%; }
.frame-thin .avw{ padding: 2px; background: var(--stroke-hi); }
.frame-accent .avw{ padding: 2px; background: var(--accent); }
.frame-gradient .avw{ padding: 2px; background: conic-gradient(from 200deg, var(--brand), #BF5AF2, #0A84FF, var(--accent), var(--brand)); }
.frame-thin .av, .frame-accent .av, .frame-gradient .av{ box-shadow: 0 0 0 2px var(--solid); }
.avw .dot{ position: absolute; right: 1px; bottom: 1px; width: 27%; height: 27%; min-width: 9px; min-height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2.5px var(--solid); }
.no-dot .avw .dot{ display: none; }

/* ── Шапка ── */
.top{ position: relative; height: 68px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: linear-gradient(180deg, var(--head-a), var(--head-b)); }
.icon-btn{ width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--fill); display: grid; place-items: center; cursor: pointer; flex: none; transition: background var(--d1) var(--ease), transform var(--d2) var(--spring); }
.icon-btn:hover{ background: var(--fill-2); }
.icon-btn:active{ transform: scale(.9); }
.icon-btn.ghost{ background: transparent; }
.icon-btn.ghost:hover{ background: var(--fill); }
.acc-btn{ display: flex; align-items: center; gap: 10px; padding: 5px 10px 5px 5px; border: 0; border-radius: 16px; background: transparent; cursor: pointer; text-align: left; min-width: 0; transition: background var(--d1) var(--ease), transform var(--d2) var(--spring); }
.acc-btn:hover{ background: var(--fill); }
.acc-btn:active{ transform: scale(.97); }
.acc-btn b{ display: block; font-size: 15px; white-space: nowrap; }
.acc-btn small{ color: var(--text-2); font-size: 12.5px; }
.acc-btn .chev{ width: 14px; height: 14px; color: var(--text-3); transition: transform var(--d2) var(--spring); }
.acc-btn[aria-expanded="true"] .chev{ transform: rotate(180deg); }
.acc-btn .stack{ position: relative; }
.acc-btn .count{ position: absolute; top: -4px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--solid); }
.brand{ position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 1px solid rgba(var(--brand-rgb),.26); background: rgba(var(--brand-rgb),.09); cursor: pointer; user-select: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: transform var(--d2) var(--spring), box-shadow var(--d2) var(--ease), background var(--d1) var(--ease); }
.brand:hover{ transform: translate(-50%,-50%) scale(1.04); background: rgba(var(--brand-rgb),.15); box-shadow: 0 8px 30px -6px rgba(var(--brand-rgb),.6); }
.brand:active{ transform: translate(-50%,-50%) scale(.96); }
.brand .logo{ width: 34px; height: 34px; filter: drop-shadow(0 4px 12px rgba(var(--brand-rgb),.55)); }
.brand .word{ font: 800 22px/1 var(--display); letter-spacing: -.035em; color: var(--brand); text-shadow: 0 0 18px rgba(var(--brand-rgb),.45); }
.brand .chev{ width: 13px; height: 13px; color: var(--brand); transition: transform var(--d2) var(--spring); }
.brand[aria-expanded="true"] .chev{ transform: rotate(180deg); }
.spacer{ flex: 1; }
.streamer-badge{ display: none; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: var(--accent); background: rgba(var(--accent-rgb),.12); border: 1px solid rgba(var(--accent-rgb),.3); }
.streamer-badge svg{ width: 15px; height: 15px; }
.streamer .streamer-badge{ display: inline-flex; }
.streamer .sens, .hide-un .uname, .hide-id .uid{ filter: blur(5px); transition: filter var(--d1); }
.streamer .sens:hover, .hide-un .uname:hover, .hide-id .uid:hover{ filter: none; }

/* ── Список чатов ── */
.main{ display: grid; grid-template-columns: 350px 1fr; gap: 12px; min-height: 0; }
.side{ display: flex; flex-direction: column; min-height: 0; background: var(--surface-2); overflow: hidden; }
.side-head{ display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 4px 20px; }
.side-head h1{ margin: 0; font: 800 26px/1 var(--display); letter-spacing: -.04em; }
.seg{ display: flex; padding: 3px; gap: 2px; border-radius: 14px; background: var(--fill); border: 1px solid var(--stroke); }
.seg button{ width: 36px; height: 30px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--text-2); transition: background var(--d1) var(--ease), color var(--d1), transform var(--d2) var(--spring); }
.seg button:hover{ background: var(--hover); color: var(--text); }
.seg button:active{ transform: scale(.88); }
.seg button[aria-pressed="true"]{ background: var(--accent); color: #fff; box-shadow: 0 4px 12px -4px rgba(var(--accent-rgb),.8); }
.seg svg{ width: 17px; height: 17px; }
.search{ padding: 12px 14px 8px; }
.field{ width: 100%; height: 38px; border: 1px solid transparent; border-radius: 12px; outline: none; padding: 0 12px 0 36px; color: var(--text); font: 400 15px var(--font); background: var(--fill); transition: background-color var(--d1), border-color var(--d1), box-shadow var(--d2) var(--ease); }
.field::placeholder{ color: var(--text-2); }
.field:focus{ background-color: var(--fill-2); border-color: rgba(var(--accent-rgb),.55); box-shadow: 0 0 0 4px rgba(var(--accent-rgb),.18); }
.field-wrap{ position: relative; }
.field-wrap > svg{ position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-2); pointer-events: none; }
.list{ flex: 1; overflow-y: auto; padding: 2px 0 10px; }
.empty-list{ padding: 30px 20px; text-align: center; color: var(--text-3); font-size: 14px; }
.item{ position: relative; display: flex; align-items: center; gap: 12px; width: calc(100% - 16px); margin: 2px 8px; padding: 10px 12px; border: 0; border-radius: 14px; background: transparent; text-align: left; cursor: pointer; transition: background var(--d1) var(--ease), transform var(--d2) var(--spring); }
.list-anim .item{ animation: rise var(--d2) var(--spring) both; animation-delay: calc(var(--i,0) * 35ms * var(--spd)); }
.compact .item{ padding: 6px 12px; margin: 0 8px; }
.item::after{ content:""; position: absolute; left: 74px; right: 12px; bottom: -2px; height: .5px; background: var(--sep); }
.item:last-child::after, .item:hover::after, .item.active::after{ opacity: 0; }
.item:hover{ background: var(--hover); }
.item:active{ transform: scale(.975); }
.item:hover .avw{ transform: scale(1.05); }
.item.active{ background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 24px -10px rgba(var(--accent-rgb),.9); color: #fff; }
.item.active .sub, .item.active .time, .item.active .pin, .item.active .muted-ic{ color: rgba(255,255,255,.82); }
.item.active .badge{ background: #fff; color: var(--accent); }
.item.active .avw .dot{ background: #fff; box-shadow: 0 0 0 2.5px var(--accent); }
.item.active .vf path:first-child{ fill: #fff; }
.item.active .vf path:last-child{ stroke: var(--accent); }
@keyframes rise{ from{ opacity: 0; transform: translateY(10px) scale(.985); } }
.meta{ flex: 1; min-width: 0; display: grid; gap: 3px; }
.row{ display: flex; align-items: center; gap: 6px; min-width: 0; }
.name{ font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vf{ width: 16px; height: 16px; flex: none; }
.time{ margin-left: auto; color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; flex: none; }
.sub{ color: var(--text-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.sub b{ color: var(--text); font-weight: 500; }
.item.active .sub b{ color: #fff; }
.badge{ min-width: 21px; height: 21px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; flex: none; }
.badge.muted{ background: var(--fill-2); color: var(--text); }
.pin, .muted-ic{ width: 14px; height: 14px; color: var(--text-3); flex: none; }

/* ── Переписка ── */
.chat{ position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background-color: var(--chat); }
.chat::before{ content:""; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: var(--pattern);
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180' fill='none' stroke='black' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M20 30l8 4-8 4 2-4z'/><circle cx='70' cy='22' r='6'/><path d='M120 18l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z'/><path d='M160 60c-6 0-10 4-10 10s4 10 10 10'/><path d='M30 90h18M39 81v18'/><ellipse cx='95' cy='88' rx='14' ry='6' transform='rotate(-20 95 88)'/><path d='M140 120l10-6 2 12z'/><circle cx='40' cy='150' r='3'/><path d='M80 140c4-8 12-8 16 0s12 8 16 0'/><path d='M160 160l6-6M160 154l6 6'/></svg>") 0 0 / 180px 180px;
  mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180' fill='none' stroke='black' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M20 30l8 4-8 4 2-4z'/><circle cx='70' cy='22' r='6'/><path d='M120 18l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z'/><path d='M160 60c-6 0-10 4-10 10s4 10 10 10'/><path d='M30 90h18M39 81v18'/><ellipse cx='95' cy='88' rx='14' ry='6' transform='rotate(-20 95 88)'/><path d='M140 120l10-6 2 12z'/><circle cx='40' cy='150' r='3'/><path d='M80 140c4-8 12-8 16 0s12 8 16 0'/><path d='M160 160l6-6M160 154l6 6'/></svg>") 0 0 / 180px 180px; }
.no-pattern .chat::before{ display: none; }
.chat > .chat-inner{ position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chat > .chat-bg{ position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.placeholder{ margin: auto; display: grid; justify-items: center; gap: 14px; text-align: center; padding: 20px; }
.placeholder .logo{ width: 84px; height: 84px; filter: drop-shadow(0 12px 30px rgba(var(--brand-rgb),.45)); }
.float-logo .placeholder .logo{ animation: float 4s ease-in-out infinite; }
.pill{ padding: 10px 18px; border-radius: 999px; background: var(--pop); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--stroke); box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); font-weight: 600; }
.hint{ color: var(--text-3); font-size: 13px; }
@keyframes float{ 50%{ transform: translateY(-6px); } }

.chat-head{ display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; min-height: 64px; border-bottom: .5px solid var(--sep); background: var(--head-b); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.chat-head .who{ display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; border: 0; background: none; padding: 4px; border-radius: 12px; cursor: pointer; text-align: left; transition: background var(--d1); }
.chat-head .who:hover{ background: var(--hover); }
.chat-head .meta b{ font-size: 16px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.chat-head .meta small{ color: var(--text-2); font-size: 13px; }
.chat-head .meta small.on{ color: var(--accent); }
.head-actions{ display: flex; gap: 4px; }
.back{ display: none; }
.chat-search{ display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: .5px solid var(--sep); background: var(--head-b); }
.chat-search .field-wrap{ flex: 1; }
.chat-search span{ font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
mark{ background: rgba(var(--accent-rgb),.35); color: inherit; border-radius: 4px; padding: 0 2px; }
.pinbar{ display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: .5px solid var(--sep); background: var(--head-b); cursor: pointer; }
.pinbar::before{ content:""; width: 3px; align-self: stretch; border-radius: 3px; background: var(--accent); }
.pinbar div{ min-width: 0; flex: 1; }
.pinbar b{ display: block; font-size: 13px; color: var(--accent); }
.pinbar span{ display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }

.msgs{ flex: 1; overflow-y: auto; padding: 16px clamp(12px, 3.5vw, 44px); display: flex; flex-direction: column; gap: 4px; }
.day{ align-self: center; margin: 4px 0 10px; padding: 4px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: var(--text-2); background: var(--pop); border: 1px solid var(--stroke); }
.mrow{ display: flex; align-items: flex-end; gap: 8px; }
.mrow.out{ justify-content: flex-end; }
.mrow.gap{ margin-top: 6px; }
.mrow .slot{ width: 36px; flex: none; }
.no-msg-av .mrow .slot{ display: none; }
.mrow .slot .avw{ cursor: pointer; }
.mrow.sel{ background: rgba(var(--accent-rgb),.12); border-radius: 14px; }
.selecting .mrow{ cursor: pointer; padding: 2px 4px; }
.selecting .mrow::before{ content:""; width: 20px; height: 20px; flex: none; align-self: center; border-radius: 50%; border: 2px solid var(--text-3); }
.selecting .mrow.sel::before{ border-color: var(--accent); background: var(--accent) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 12l4 4 8-9'/></svg>") center/14px no-repeat; }
.bubble{ position: relative; max-width: min(520px, 78%); padding: 7px 12px 6px; border-radius: var(--bubble-r); font-size: var(--fs); line-height: 1.4; background: var(--bubble-in); border: 1px solid var(--stroke); overflow-wrap: anywhere; user-select: text; transition: transform var(--d1) var(--ease); }
.mrow.out .bubble{ background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; box-shadow: 0 6px 18px -8px rgba(var(--accent-rgb),.8); }
.bubble .from{ display: block; font-size: 13px; font-weight: 600; margin-bottom: 1px; }
.bubble .fwd{ display: block; font-size: 12.5px; opacity: .75; margin-bottom: 2px; }
.bubble .fwd b{ font-weight: 600; }
.bubble .foot{ display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11.5px; margin-top: 1px; opacity: .62; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bubble .foot svg{ width: 14px; height: 14px; }
.quote{ display: block; margin: 2px 0 5px; padding: 4px 8px; border-radius: 8px; border-left: 3px solid var(--accent); background: rgba(var(--accent-rgb),.12); font-size: 13px; cursor: pointer; max-width: 100%; }
.mrow.out .quote{ border-left-color: #fff; background: rgba(255,255,255,.18); }
.quote b{ display: block; color: var(--accent); font-size: 12.5px; }
.mrow.out .quote b{ color: #fff; }
.quote span{ display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
.reacts{ display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.react{ display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 99px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; background: rgba(var(--accent-rgb),.16); color: var(--accent); transition: transform var(--d2) var(--spring); }
.react:active{ transform: scale(.88); }
.react.mine{ background: var(--accent); color: #fff; }
.mrow.out .react{ background: rgba(255,255,255,.22); color: #fff; }
.mrow.out .react.mine{ background: #fff; color: var(--accent); }
.flash .bubble{ animation: flash 1.2s var(--ease); }
@keyframes flash{ 0%,60%{ box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.7); } }

/* появление сообщений */

.ctrls .play svg{ width: 24px; height: 24px; }
.connect{ display: grid; justify-items: center; gap: 10px; padding: 12px 0; text-align: center; }
.note{ font-size: 12px; color: var(--text-3); line-height: 1.4; }
.ai-log{ display: grid; gap: 8px; max-height: 260px; overflow-y: auto; align-content: start; }
.ai-msg{ padding: 8px 12px; border-radius: 14px; background: var(--bubble-in); border: 1px solid var(--stroke); font-size: 14px; max-width: 90%; justify-self: start; animation: pop var(--d2) var(--spring); }
.ai-msg.me{ justify-self: end; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
.ai-msg small{ display: block; font-size: 11.5px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.aw-form{ display: flex; gap: 8px; align-items: center; }
.aw-form .field{ padding-left: 12px; }
.aw-form .send{ width: 38px; height: 38px; }
.aw-form .send svg{ width: 17px; height: 17px; }
.link-out{ display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--fill); color: var(--accent); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.link-out svg{ width: 17px; height: 17px; flex: none; }
.game-top{ display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); }
.game-top b{ color: var(--accent); font-variant-numeric: tabular-nums; }
.game-wrap canvas{ display: block; width: 100%; aspect-ratio: 1; border-radius: 14px; background: var(--chat); border: 1px solid var(--stroke); touch-action: none; }
.pad{ display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; justify-content: center; }
.pad button{ height: 40px; border: 0; border-radius: 10px; background: var(--fill); cursor: pointer; font-size: 15px; }
.pad button:hover{ background: var(--fill-2); }

/* ── Активность ── */
.act-card{ display: flex; gap: 12px; align-items: center; margin: 4px 6px 8px; padding: 10px; border-radius: 14px; background: var(--fill); text-align: left; }
.set-scroll .act-card, #myAct .act-card{ margin: 8px 0 0; }
.act-art{ width: 56px; height: 56px; border-radius: 12px; flex: none; display: grid; place-items: center; font-size: 28px; background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 8px 18px -10px var(--a1); }
.act-card .t{ flex: 1; min-width: 0; display: grid; gap: 1px; }
.act-card small.k{ font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; }
.act-card b{ white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-card span{ font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.act-card .prog{ margin-top: 5px; cursor: default; }
.act-line{ color: var(--accent) !important; font-variant-numeric: tabular-nums; }
.item.active .act-line{ color: #fff !important; }
.tg-badge{ display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px 3px 4px; border-radius: 99px; background: rgba(var(--brand-rgb),.14); color: var(--brand); }
.tg-badge svg{ width: 16px; height: 16px; }

/* ── Фон чата ── */
.chat-bg > img, .chat-bg > video{ position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(var(--bgb, 0px)); transform: scale(var(--bgs, 1)); }
.chat-bg .dim{ position: absolute; inset: 0; background: #000; opacity: var(--bg-dim, 0); }
.chat-bg.anim{ animation: bgshift 16s ease infinite; }
@keyframes bgshift{ 0%, 100%{ background-position: 0% 50%; } 50%{ background-position: 100% 50%; } }
.bg-prev{ position: relative; height: 160px; margin-top: 8px; border-radius: 16px; overflow: hidden; border: 1px solid var(--stroke); background: var(--chat); }
.bg-prev .chat-bg{ position: absolute; inset: 0; }
.bg-prev .mini{ position: absolute; left: 12px; right: 12px; bottom: 12px; display: grid; gap: 6px; }
.bg-prev .b{ justify-self: start; padding: 6px 11px; border-radius: 12px; background: var(--bubble-in); font-size: 13px; }
.bg-prev .b.o{ justify-self: end; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.tiles{ display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 8px; }
.tile{ position: relative; height: 64px; border: 0; border-radius: 12px; cursor: pointer; display: flex; align-items: flex-end; padding: 6px 8px; font-size: 12.5px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.55); transition: transform var(--d2) var(--spring), box-shadow var(--d1); }
.tile:hover{ transform: scale(1.04); }
.tile[aria-pressed="true"]{ box-shadow: 0 0 0 2px var(--solid), 0 0 0 4px var(--accent); }
.theme-tile{ height: 104px; flex-direction: column; align-items: stretch; justify-content: space-between; gap: 6px; padding: 8px; }
.theme-tile .row{ font-size: 12.5px; }
.theme-tile .bub{ display: block; height: 14px; border-radius: 7px; width: 58%; align-self: flex-end; }
.theme-tile .bub.in{ align-self: flex-start; width: 46%; background: rgba(255,255,255,.85); }
.colors{ display: flex; gap: 10px; padding: 12px 14px; align-items: center; flex-wrap: wrap; }
.colors label{ flex: 1; }
.colors input[type=color]{ width: 42px; height: 32px; border: 0; border-radius: 8px; background: none; cursor: pointer; padding: 0; }

/* ── Режим экономии ── */
.eco *, .eco *::before, .eco *::after{ -webkit-backdrop-filter: none !important; backdrop-filter: none !important; animation: none !important; }
.eco #aurora{ display: none; }
.eco .glass, .eco .pop, .eco .drawer, .eco .modal, .eco .appwin{ background: var(--solid); }

  function openSettings() {
    closeAll();
    const el = layer('modal', `
      <nav class="m-nav" aria-label="Разделы настроек"><div class="pop-head"><svg class="logo"><use href="#logo"/></svg><b>Настройки</b></div>

  function fillSection() {

    bindControls(body);
    afterSection(body);

  function bindControls(body) {
    $$('[data-sw]', body).forEach((box) => {
      const k = box.dataset.sw;
      const list = SWP[k] || PRESETS;
      const draw = () => {
        const isPreset = list.some((c) => c.toLowerCase() === S[k].toLowerCase());
        box.innerHTML = list.map((c) => `<button class="sw" style="background:${c};color:${c}" data-c="${c}" aria-label="Цвет ${c}" aria-pressed="${S[k].toLowerCase() === c.toLowerCase()}"></button>`).join('')
          + `<label class="sw custom" style="color:${S[k]}" aria-pressed="${!isPreset}" title="Свой цвет"><input type="color" value="${S[k]}" aria-label="Свой цвет"></label>`;
        $$('[data-c]', box).forEach((b) => b.onclick = () => { set(k, b.dataset.c); draw(); });
        const ci = $('input', box); ci.oninput = () => set(k, ci.value); ci.onchange = draw;
      };
      draw();
    });
    $$('input[data-k]', body).forEach((inp) => {
      const k = inp.dataset.k;
      if (inp.type === 'checkbox') { inp.checked = !!S[k]; inp.onchange = () => set(k, inp.checked); }
      else if (inp.type === 'color') { inp.value = S[k]; inp.oninput = () => set(k, inp.value); }
      else {
        const out = inp.nextElementSibling, f = inp.dataset.fmt;
        const show = () => { out.textContent = f === 'x' ? (+inp.value).toFixed(1) + '×' : inp.value + ' ' + f; };
        inp.value = S[k]; show(); inp.oninput = () => { set(k, +inp.value); show(); };
      }
    });

      const k = g.dataset.seg;
      const sync = () => $$('button', g).forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S[k]));
      sync();
      $$('button', g).forEach((b) => b.onclick = () => { set(k, b.dataset.v); sync(); if (k === 'timeFmt' || k === 'msgAnim') refreshPreview(k === 'msgAnim'); if (k === 'bgType') fillBgOpts(); });
    });
    if ($('#testAnim')) $('#testAnim').onclick = () => refreshPreview(true);
    if ($('#resetAll')) $('#resetAll').onclick = () => { S = { ...DEF }; save(); apply(); renderAll(); renderBg(); renderClock(); renderDock(); fillSection(); toast(ic('check') + 'Настройки сброшены'); };

  function refreshPreview(animate) {

  function afterSection(body) {
    if (section === 'bg') { renderBg(); fillBgOpts(); }

      <div class="set-note">Фото и GIF до 2,5 МБ сохраняются в браузере. Видео и большие файлы держатся до перезагрузки страницы. Видео идёт без звука по кругу${S.eco ? '; в режиме экономии оно на паузе' : ''}.</div>`;

  function pickBg(file) {
    if (!file) return;
    const kind = file.type.startsWith('video') ? 'video' : 'image';
    const done = (msg) => { set('bgType', 'media'); fillSection(); toast(ic('image') + msg); };
    if (kind === 'image' && file.size < 2.5e6) {
      const r = new FileReader();
      r.onload = () => { bgMedia = { kind, url: r.result }; try { localStorage.setItem('tristegram.bgimg', r.result); } catch (e) {} done('Фон установлен'); };

      try { localStorage.removeItem('tristegram.bgimg'); } catch (e) {}

  // ═════ приложения ═════

  const player = { svc: null, playing: false, i: 0, pos: 0, vol: 70 };
  let win = null, winApp = null, game = null, gameStart = 0;

  // музыка

      $('#conBtn', body).onclick = (e) => { e.currentTarget.textContent = 'Подключение…'; e.currentTarget.disabled = true; setTimeout(() => { set('con_' + svc, true); if (winApp === svc) musicUI(body, svc); toast(ic('check') + `${a.name} подключён`); }, 900); };

      <div class="track"><b>${esc(t.t)}</b><span>${esc(t.a)} · ${a.name}</span></div>
      <div><span class="prog" id="mBar"><i id="mProg"></i></span><div class="prog-t"><span id="mPos"></span><span>${mmss(t.d)}</span></div></div>
      <div class="ctrls"><button class="icon-btn ghost" id="mPrev" aria-label="Предыдущий трек">${ic('prev')}</button><button class="play" id="mPlay" aria-label="${player.playing ? 'Пауза' : 'Играть'}">${ic(player.playing ? 'pause' : 'play')}</button><button class="icon-btn ghost" id="mNext" aria-label="Следующий трек">${ic('next')}</button></div>
      <div class="set-row" style="padding:0;min-height:0"><label for="mVol" class="note">Громкость</label><input type="range" id="mVol" min="0" max="100" value="${player.vol}"></div>
      <span class="note">Прототип: звука нет, трек «играет» по таймеру и виден друзьям в активности.</span>`;

    $('#mPrev', body).onclick = () => go(-1); $('#mNext', body).onclick = () => go(1);

    $('#mBar', body).onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); player.pos = Math.floor((e.clientX - r.left) / r.width * t.d); updateMusic(); };
    updateMusic();
  }
  function updateMusic() { const p = $('#mProg'); if (!p) return; const t = TRACKS[player.i]; p.style.width = (player.pos / t.d * 100) + '%'; $('#mPos').textContent = mmss(player.pos); }

  // ИИ
  const ai = { model: 'Claude', log: [{ me: false, t: 'Привет! Я ассистент в Tristegram. Выбери модель и спроси что-нибудь, не выходя из чата.' }] };
  function aiUI(body) {
    body.innerHTML = `<div class="segc" style="margin:0">${['Claude', 'ChatGPT', 'Gemini', 'DeepSeek'].map((m) => `<button data-m="${m}" aria-pressed="${ai.model === m}">${m}</button>`).join('')}</div>
      <div class="ai-log" id="aiLog"></div>
      <form class="aw-form" id="aiForm"><input class="field" id="aiIn" placeholder="Спроси что-нибудь…" autocomplete="off" aria-label="Вопрос ассистенту"><button class="send" aria-label="Отправить">${ic('send')}</button></form>
      <span class="note">Прототип: ответы-примеры. В настоящем клиенте сюда подключается твой ключ API.</span>`;
    const draw = () => { const l = $('#aiLog', body); l.innerHTML = ai.log.map((m) => `<div class="ai-msg${m.me ? ' me' : ''}">${m.me ? '' : `<small>${esc(m.model || ai.model)}</small>`}${esc(m.t)}</div>`).join(''); l.scrollTop = 1e9; };

    $$('[data-m]', body).forEach((b) => b.onclick = () => { ai.model = b.dataset.m; $$('[data-m]', body).forEach((x) => x.setAttribute('aria-pressed', x === b)); });

    };
  }

  // Google
  function googleUI(body) {
    body.innerHTML = `<form class="aw-form" id="gForm"><input class="field" id="gIn" placeholder="Поиск в Google" autocomplete="off" aria-label="Поиск в Google"><button class="send" aria-label="Искать">${ic('search')}</button></form><div id="gRes"></div><span class="note">Результаты откроются в браузере. В настоящем клиенте они будут прямо в этом окне.</span>`;
    $('#gForm', body).onsubmit = (e) => { e.preventDefault(); const q = $('#gIn', body).value.trim(); if (!q) return; $('#gRes', body).innerHTML = `<a class="link-out" href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${ic('ext')}Открыть «${esc(q)}» в Google</a>`; };
  }

  // Змейка
  function gameUI(body) {
    let best = 0; try { best = +localStorage.getItem('tristegram.snake') || 0; } catch (e) {}
    body.innerHTML = `<div class="game-top"><span>Счёт: <b id="gScore">0</b></span><span>Рекорд: <b id="gBest">${best}</b></span></div>
      <div class="game-wrap"><canvas id="gCv" width="300" height="300" aria-label="Игровое поле"></canvas></div>
      <div class="pad"><span></span><button data-d="0,-1" aria-label="Вверх">▲</button><span></span><button data-d="-1,0" aria-label="Влево">◀</button><button id="gRe" aria-label="Заново">⟳</button><button data-d="1,0" aria-label="Вправо">▶</button><span></span><button data-d="0,1" aria-label="Вниз">▼</button><span></span></div>
      <span class="note">Стрелки или WASD, пробел — заново. Окно можно перетащить за шапку и играть рядом с чатом.</span>`;
    gameStart = Date.now();
    const cv = $('#gCv', body), ctx = cv.getContext('2d'), N = 15, C = 20, st = { best };
    const food = () => { do { st.food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (st.snake.some((s) => s.x === st.food.x && s.y === st.food.y)); };
    const reset = () => { st.snake = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }]; st.dir = { x: 1, y: 0 }; st.next = st.dir; st.score = 0; st.over = false; food(); $('#gScore').textContent = 0; draw(); };
    function draw() {
      const cs = getComputedStyle(document.documentElement), acc = cs.getPropertyValue('--accent').trim(), br = cs.getPropertyValue('--brand').trim();
      ctx.clearRect(0, 0, 300, 300);
      ctx.fillStyle = 'rgba(128,128,128,.08)';
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if ((i + j) % 2) ctx.fillRect(i * C, j * C, C, C);
      ctx.fillStyle = br; ctx.beginPath(); ctx.arc(st.food.x * C + C / 2, st.food.y * C + C / 2, C / 2 - 3, 0, 7); ctx.fill();
      st.snake.forEach((s, i) => { ctx.globalAlpha = i ? Math.max(.45, 1 - i * .04) : 1; ctx.fillStyle = acc; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(s.x * C + 2, s.y * C + 2, C - 4, C - 4, 6); else ctx.rect(s.x * C + 2, s.y * C + 2, C - 4, C - 4); ctx.fill(); });
      ctx.globalAlpha = 1;
      if (st.over) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, 300, 300); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '700 20px Inter, sans-serif'; ctx.fillText('Игра окончена', 150, 140); ctx.font = '500 14px Inter, sans-serif'; ctx.fillText('Нажми ⟳ или пробел', 150, 166); }
    }
    function step() {
      if (st.over) return;
      st.dir = st.next;
      const h = { x: (st.snake[0].x + st.dir.x + N) % N, y: (st.snake[0].y + st.dir.y + N) % N };
      if (st.snake.some((s) => s.x === h.x && s.y === h.y)) {
        st.over = true;
        if (st.score > st.best) { st.best = st.score; try { localStorage.setItem('tristegram.snake', st.best); } catch (e) {} $('#gBest').textContent = st.best; }
        return draw();
      }
      st.snake.unshift(h);
      if (h.x === st.food.x && h.y === st.food.y) { st.score++; $('#gScore').textContent = st.score; food(); } else st.snake.pop();
      draw();
    }
    reset();
    game = { timer: setInterval(step, 130), turn(dx, dy) { if (st.over) return; if (dx === -st.dir.x && dy === -st.dir.y) return; st.next = { x: dx, y: dy }; }, restart: reset };
    $$('[data-d]', body).forEach((b) => b.onclick = () => { const [dx, dy] = b.dataset.d.split(',').map(Number); game.turn(dx, dy); });
    $('#gRe', body).onclick = () => game.restart();
    let sx, sy;
    cv.onpointerdown = (e) => { sx = e.clientX; sy = e.clientY; };
    cv.onpointerup = (e) => { const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return; Math.abs(dx) > Math.abs(dy) ? game.turn(Math.sign(dx), 0) : game.turn(0, Math.sign(dy)); };
  }
  function stopGame() { if (game) { clearInterval(game.timer); game = null; } }
  const DIRS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };

  // ═════ живой таймер: часы, пинг, музыка, активность ═════
  setInterval(() => {
    if (player.playing) {

      const key = el.dataset.live, a = getAct(key); if (!a) return;

  // ═════ тост ═════
  let tt;
  function toast(html, ms = 2200) { const el = $('#toast'); el.innerHTML = html; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(hideToast, ms); }
  function hideToast() { $('#toast').classList.remove('show'); }

  // ═════ события ═════
  function openChat(id) { active = id; replyTo = editing = null; searchOpen = false; chatQuery = ''; exitSelect(); renderList(); renderChat(); }
  function setFilter(f) { filter = filter === f ? null : f; $$('[data-filter]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.filter === filter)); renderList(); }

  $('#brand').onclick = () => (layers.length ? closeAll() : openBrandMenu());

  $('#menuBtn').onclick = openDrawer;
  $('#q').oninput = renderList;
  $('#list').onclick = (e) => { const b = e.target.closest('.item'); if (b) openChat(b.dataset.id); };
  $('#list').oncontextmenu = (e) => {
    const b = e.target.closest('.item'); if (!b) return; e.preventDefault();
    const c = chats().find((x) => x.id === b.dataset.id); closeAll();
    const el = layer('pop narrow', `${mi('chat', 'Открыть', 'open')}${mi(c.muted ? 'bell' : 'bellOff', c.muted ? 'Включить уведомления' : 'Выключить уведомления', 'mute')}${mi('pin', c.pinned ? 'Открепить' : 'Закрепить', 'pin')}${mi('check', 'Отметить прочитанным', 'read')}`, { clear: true });
    placeAt(el, e.clientX, e.clientY, 'top left');
    bind(el, { open: () => { closeAll(); openChat(c.id); }, mute: () => { closeAll(); toggleMute(c); }, pin: () => { closeAll(); c.pinned = !c.pinned; chats().sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)); renderList(); }, read: () => { closeAll(); c.unread = 0; renderList(); renderHeader(); } });
  };
  $$('[data-filter]').forEach((b) => b.onclick = () => setFilter(b.dataset.filter));

  const chatEl = $('#chat');
  const msgOf = (el) => { const row = el.closest('.mrow[data-mid]'); return row && chat()?.msgs.find((m) => m.id === +row.dataset.mid); };
  chatEl.addEventListener('contextmenu', (e) => { const m = msgOf(e.target); if (!m || selecting) return; e.preventDefault(); openMsgMenu(m, e.clientX, e.clientY); });
  chatEl.addEventListener('dblclick', (e) => { const m = msgOf(e.target); const c = chat(); if (!m || selecting || c.type === 'channel') return; window.getSelection()?.removeAllRanges(); replyTo = m; editing = null; renderBottom(); });
  chatEl.addEventListener('click', (e) => {
    const r = e.target.closest('[data-react]'); const m = msgOf(e.target);
    if (r && m && !selecting) return toggleReaction(m, r.dataset.react);
    const q = e.target.closest('[data-jump]'); if (q && !selecting) return jumpTo(+q.dataset.jump);
    const u = e.target.closest('[data-user]'); if (u && !selecting) { const p = people[u.dataset.user]; if (p) openInfo({ type: 'user', user: u.dataset.user, chatId: p.id }); return; }
    if (selecting && m) { selected.has(m.id) ? selected.delete(m.id) : selected.add(m.id); if (!selected.size) return exitSelect(); renderMsgs(); renderBottom(); }
  });
  let lp;
  chatEl.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') return; const m = msgOf(e.target); if (!m) return; lp = setTimeout(() => openMsgMenu(m, e.clientX, e.clientY), 480); });
  ['pointerup', 'pointercancel', 'pointermove'].forEach((t) => chatEl.addEventListener(t, () => clearTimeout(lp)));

  document.addEventListener('keydown', (e) => {
    const typing = e.target.closest && e.target.closest('input, textarea');
    if (game && !typing && !layers.length) {
      if (DIRS[e.code]) { e.preventDefault(); game.turn(...DIRS[e.code]); return; }
      if (e.code === 'Space') { e.preventDefault(); game.restart(); return; }
    }
    if (e.key === 'Escape') { if (layers.length) closeAll(); else if (selecting) exitSelect(); else if (replyTo || editing) { replyTo = editing = null; renderBottom(); } else if (win) closeApp(); }
    if (e.ctrlKey && /^Digit[1-9]$/.test(e.code)) { e.preventDefault(); closeAll(); switchAccount(+e.code.slice(5) - 1); }
    if (e.ctrlKey && e.code === 'Comma') { e.preventDefault(); openSettings(); }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyT') { e.preventDefault(); layers.length ? closeAll() : openBrandMenu(); }
  });
  addEventListener('resize', closeAll);

  renderAll(); renderClock(); renderDock(); renderBg();
})();
</script>
